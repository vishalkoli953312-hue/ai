<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevAI Studio Pro</title>
    
    <style>
        /* Base Reset & Variables */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        :root {
            --bg-main: #0d1117;
            --bg-card: #161b22;
            --bg-hover: #21262d;
            --border-color: #30363d;
            --accent-blue: #2f81f7;
            --accent-blue-hover: #1c68d4;
            --accent-purple: #a371f7;
            --text-white: #f0f6fc;
            --text-muted: #8b949e;
            --success-color: #3fb950;
            --danger-color: #f85149;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-white);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Top Navigation */
        .topbar {
            height: 56px;
            background-color: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 10;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: bold;
            font-size: 16px;
        }

        .brand-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, var(--accent-blue), #8a2be2);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .brand-badge {
            font-size: 10px;
            background: rgba(47, 129, 247, 0.15);
            color: var(--accent-blue);
            border: 1px solid rgba(47, 129, 247, 0.3);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
        }

        .model-pill {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--bg-main);
            border: 1px solid var(--border-color);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-family: monospace;
        }

        .btn-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-white);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            transition: 0.2s;
        }

        .btn:hover {
            background: var(--bg-hover);
            border-color: #8b949e;
        }

        .btn-primary {
            background: var(--accent-blue);
            border: none;
            color: #ffffff;
            font-weight: 500;
        }

        .btn-primary:hover {
            background: var(--accent-blue-hover);
        }

        /* Workspace Layout */
        .workspace {
            flex: 1;
            display: flex;
            overflow: hidden;
            position: relative;
        }

        /* Sidebar */
        .sidebar {
            width: 280px;
            background-color: var(--bg-card);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 16px;
            gap: 16px;
            overflow-y: auto;
        }

        .sidebar-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            font-weight: 700;
        }

        .param-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .param-label {
            font-size: 12px;
            font-weight: 500;
            display: flex;
            justify-content: space-between;
        }

        .param-value {
            color: var(--accent-blue);
            font-family: monospace;
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--accent-blue);
            cursor: pointer;
        }

        textarea.sidebar-input {
            width: 100%;
            background: var(--bg-main);
            border: 1px solid var(--border-color);
            color: var(--text-white);
            padding: 8px;
            border-radius: 6px;
            font-size: 12px;
            resize: none;
            outline: none;
        }

        textarea.sidebar-input:focus {
            border-color: var(--accent-blue);
        }

        /* Chat Area */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-main);
            overflow: hidden;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .msg-box {
            display: flex;
            gap: 12px;
            max-width: 850px;
            width: 100%;
            margin: 0 auto;
        }

        .msg-box.user {
            justify-content: flex-end;
        }

        .msg-avatar {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            flex-shrink: 0;
        }

        .msg-avatar.ai {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--accent-blue);
        }

        .msg-avatar.user {
            background: var(--accent-blue);
            color: white;
        }

        .msg-content {
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.6;
            max-width: 80%;
            word-break: break-word;
        }

        .msg-box.user .msg-content {
            background: var(--accent-blue);
            color: white;
            border-top-right-radius: 2px;
        }

        .msg-box.ai .msg-content {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-white);
            border-top-left-radius: 2px;
        }

        /* Code Block Container */
        pre {
            background: #000000 !important;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 12px;
            margin: 10px 0;
            overflow-x: auto;
            font-family: monospace;
            font-size: 13px;
        }

        /* Input Area */
        .input-bar {
            padding: 14px 20px;
            background: var(--bg-card);
            border-top: 1px solid var(--border-color);
        }

        .input-wrapper {
            max-width: 850px;
            margin: 0 auto;
            background: var(--bg-main);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .input-wrapper:focus-within {
            border-color: var(--accent-blue);
        }

        .chat-input {
            width: 100%;
            background: transparent;
            border: none;
            color: white;
            padding: 12px;
            font-size: 14px;
            resize: none;
            outline: none;
            min-height: 48px;
            max-height: 140px;
        }

        .input-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 11px;
            color: var(--text-muted);
        }

        /* Modals & Drawers */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .modal-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            width: 90%;
            max-width: 500px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .modal-input {
            width: 100%;
            background: var(--bg-main);
            border: 1px solid var(--border-color);
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            outline: none;
            margin-top: 4px;
        }

        .modal-input:focus {
            border-color: var(--accent-blue);
        }

        .hidden {
            display: none !important;
        }

        /* History Drawer */
        .drawer {
            position: fixed;
            top: 0;
            right: 0;
            bottom: 0;
            width: 300px;
            background: var(--bg-card);
            border-left: 1px solid var(--border-color);
            z-index: 50;
            display: flex;
            flex-direction: column;
            transform: translateX(100%);
            transition: transform 0.25s ease-in-out;
        }

        .drawer.open {
            transform: translateX(0);
        }

        .drawer-header {
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .history-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .history-item {
            padding: 10px;
            border-radius: 6px;
            border: 1px solid transparent;
            cursor: pointer;
            font-size: 12px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .history-item:hover {
            background: var(--bg-hover);
            color: white;
            border-color: var(--border-color);
        }

        /* Responsive for TV & Small Screens */
        @media (max-width: 768px) {
            .sidebar {
                display: none;
            }
            .model-pill {
                display: none;
            }
        }
    </style>
</head>
<body>

    <!-- TOPBAR -->
    <header class="topbar">
        <div class="brand">
            <div class="brand-icon">⚡</div>
            <span>DevAI Studio</span>
            <span class="brand-badge">PRO</span>
        </div>

        <div class="model-pill">
            <span id="badgeEngine" style="color: #3fb950;">GEMINI</span>
            <span style="color: #8b949e;">/</span>
            <span id="badgeModel">gemini-2.0-flash</span>
        </div>

        <div class="btn-group">
            <button class="btn" onclick="startNewChat()">+ New Chat</button>
            <button class="btn" onclick="toggleDrawer()">📜 History</button>
            <button class="btn" onclick="openSettings()">⚙️ Settings</button>
        </div>
    </header>

    <!-- MAIN BODY -->
    <div class="workspace">
        
        <!-- SIDEBAR PARAMETERS -->
        <aside class="sidebar">
            <div class="sidebar-title">Studio Parameters</div>

            <div class="param-group">
                <label class="param-label">System Instructions</label>
                <textarea id="systemPrompt" rows="4" class="sidebar-input" placeholder="You are a helpful software engineer AI..."></textarea>
            </div>

            <div class="param-group">
                <div class="param-label">
                    <span>Temperature</span>
                    <span id="tempValue" class="param-value">0.7</span>
                </div>
                <input id="tempSlider" type="range" min="0" max="2" step="0.1" value="0.7">
            </div>

            <div class="param-group">
                <div class="param-label">
                    <span>Max Tokens</span>
                    <span id="tokenValue" class="param-value">2048</span>
                </div>
                <input id="tokenSlider" type="range" min="256" max="8192" step="256" value="2048">
            </div>
        </aside>

        <!-- CHAT AREA -->
        <main class="chat-area">
            <div id="messagesContainer" class="messages-container">
                <!-- Welcome View -->
                <div id="welcomeView" style="text-align: center; margin: auto; max-width: 450px; padding: 20px;">
                    <div style="font-size: 40px; margin-bottom: 10px;">⚡</div>
                    <h2 style="margin-bottom: 8px;">Developer AI Playground</h2>
                    <p style="color: var(--text-muted); font-size: 13px; margin-bottom: 16px;">
                        Google Gemini & OpenRouter ready. Open <b>Settings (⚙️)</b> to add your API Key.
                    </p>
                </div>
            </div>

            <!-- Typing Indicator -->
            <div id="loadingIndicator" class="hidden" style="padding: 0 20px 8px; font-size: 12px; color: var(--accent-blue);">
                ⏳ AI is generating response...
            </div>

            <!-- Input Bar -->
            <div class="input-bar">
                <div class="input-wrapper">
                    <textarea id="userInput" class="chat-input" placeholder="Ask AI anything or paste code..."></textarea>
                    <div class="input-footer">
                        <span>Press Enter to Send</span>
                        <button class="btn btn-primary" onclick="sendMessage()">Send</button>
                    </div>
                </div>
            </div>
        </main>

        <!-- HISTORY DRAWER -->
        <div id="historyDrawer" class="drawer">
            <div class="drawer-header">
                <h3>Chat History</h3>
                <button class="btn" onclick="toggleDrawer()">✕</button>
            </div>
            <div id="historyList" class="history-list"></div>
            <div style="padding: 12px; border-top: 1px solid var(--border-color);">
                <button class="btn" style="width: 100%; color: var(--danger-color);" onclick="clearAllHistory()">Clear All History</button>
            </div>
        </div>

    </div>

    <!-- SETTINGS MODAL -->
    <div id="settingsModal" class="modal-overlay hidden">
        <div class="modal-card">
            <div class="modal-header">
                <h3>API & Model Settings</h3>
                <button class="btn" onclick="closeSettings()">✕</button>
            </div>

            <!-- Engine Picker -->
            <div>
                <label style="font-size: 12px; color: var(--text-muted);">SELECT ENGINE</label>
                <select id="engineSelect" class="modal-input" onchange="toggleEngineFields()">
                    <option value="gemini">Google Gemini API</option>
                    <option value="openrouter">OpenRouter API</option>
                </select>
            </div>

            <!-- Gemini Config -->
            <div id="geminiBox">
                <label style="font-size: 12px; color: var(--text-muted);">Gemini API Key</label>
                <input type="password" id="geminiKey" class="modal-input" placeholder="AIzaSy...">

                <label style="font-size: 12px; color: var(--text-muted); margin-top: 10px; display: block;">Gemini Model</label>
                <select id="geminiModel" class="modal-input">
                    <option value="gemini-2.0-flash">gemini-2.0-flash</option>
                    <option value="gemini-1.5-pro">gemini-1.5-pro</option>
                    <option value="gemini-1.5-flash">gemini-1.5-flash</option>
                </select>
            </div>

            <!-- OpenRouter Config -->
            <div id="openrouterBox" class="hidden">
                <label style="font-size: 12px; color: var(--text-muted);">OpenRouter API Key</label>
                <input type="password" id="openrouterKey" class="modal-input" placeholder="sk-or-v1-...">

                <label style="font-size: 12px; color: var(--text-muted); margin-top: 10px; display: block;">OpenRouter Model</label>
                <select id="openrouterModel" class="modal-input">
                    <option value="deepseek/deepseek-r1">deepseek/deepseek-r1</option>
                    <option value="anthropic/claude-3.5-sonnet">anthropic/claude-3.5-sonnet</option>
                    <option value="openai/gpt-4o">openai/gpt-4o</option>
                    <option value="meta-llama/llama-3.3-70b-instruct">meta-llama/llama-3.3-70b-instruct</option>
                </select>
            </div>

            <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 10px;">
                <button class="btn" onclick="closeSettings()">Cancel</button>
                <button class="btn btn-primary" onclick="saveSettings()">Save Settings</button>
            </div>
        </div>
    </div>

    <!-- SCRIPT -->
    <script>
        // State
        var state = {
            engine: 'gemini',
            geminiKey: '',
            geminiModel: 'gemini-2.0-flash',
            openrouterKey: '',
            openrouterModel: 'deepseek/deepseek-r1',
            systemPrompt: '',
            temperature: 0.7,
            maxTokens: 2048,
            currentChatId: null,
            chats: []
        };

        // Load & Initialize
        window.onload = function() {
            var saved = localStorage.getItem('devai_settings');
            if (saved) {
                try { Object.assign(state, JSON.parse(saved)); } catch(e){}
            }

            var savedChats = localStorage.getItem('devai_chats');
            if (savedChats) {
                try { state.chats = JSON.parse(savedChats); } catch(e){}
            }

            document.getElementById('tempSlider').oninput = function() {
                state.temperature = parseFloat(this.value);
                document.getElementById('tempValue').innerText = state.temperature;
            };

            document.getElementById('tokenSlider').oninput = function() {
                state.maxTokens = parseInt(this.value);
                document.getElementById('tokenValue').innerText = state.maxTokens;
            };

            document.getElementById('systemPrompt').onchange = function() {
                state.systemPrompt = this.value;
            };

            document.getElementById('userInput').addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });

            syncUI();
            renderHistory();
        };

        function syncUI() {
            document.getElementById('engineSelect').value = state.engine;
            document.getElementById('geminiKey').value = state.geminiKey;
            document.getElementById('geminiModel').value = state.geminiModel;
            document.getElementById('openrouterKey').value = state.openrouterKey;
            document.getElementById('openrouterModel').value = state.openrouterModel;
            document.getElementById('systemPrompt').value = state.systemPrompt;
            
            var isGem = state.engine === 'gemini';
            document.getElementById('badgeEngine').innerText = isGem ? 'GEMINI' : 'OPENROUTER';
            document.getElementById('badgeEngine').style.color = isGem ? '#3fb950' : '#a371f7';
            document.getElementById('badgeModel').innerText = isGem ? state.geminiModel : state.openrouterModel;
        }

        // Settings Modal
        function openSettings() {
            document.getElementById('settingsModal').classList.remove('hidden');
            toggleEngineFields();
        }

        function closeSettings() {
            document.getElementById('settingsModal').classList.add('hidden');
        }

        function toggleEngineFields() {
            var engine = document.getElementById('engineSelect').value;
            if (engine === 'gemini') {
                document.getElementById('geminiBox').classList.remove('hidden');
                document.getElementById('openrouterBox').classList.add('hidden');
            } else {
                document.getElementById('geminiBox').classList.add('hidden');
                document.getElementById('openrouterBox').classList.remove('hidden');
            }
        }

        function saveSettings() {
            state.engine = document.getElementById('engineSelect').value;
            state.geminiKey = document.getElementById('geminiKey').value.trim();
            state.geminiModel = document.getElementById('geminiModel').value;
            state.openrouterKey = document.getElementById('openrouterKey').value.trim();
            state.openrouterModel = document.getElementById('openrouterModel').value;

            localStorage.setItem('devai_settings', JSON.stringify(state));
            syncUI();
            closeSettings();
            alert('Settings saved!');
        }

        // Drawer
        function toggleDrawer() {
            document.getElementById('historyDrawer').classList.toggle('open');
        }

        // Chat Management
        function startNewChat() {
            state.currentChatId = null;
            renderMessages();
            document.getElementById('historyDrawer').classList.remove('open');
        }

        function getCurrentChat() {
            for (var i = 0; i < state.chats.length; i++) {
                if (state.chats[i].id === state.currentChatId) return state.chats[i];
            }
            return null;
        }

        async function sendMessage() {
            var input = document.getElementById('userInput');
            var text = input.value.trim();
            if (!text) return;

            var key = state.engine === 'gemini' ? state.geminiKey : state.openrouterKey;
            if (!key) {
                openSettings();
                alert('Please enter your ' + (state.engine === 'gemini' ? 'Gemini' : 'OpenRouter') + ' API Key first!');
                return;
            }

            var chat = getCurrentChat();
            if (!chat) {
                chat = {
                    id: 'chat_' + Date.now(),
                    title: text.substring(0, 30),
                    messages: []
                };
                state.chats.unshift(chat);
                state.currentChatId = chat.id;
            }

            chat.messages.push({ role: 'user', content: text });
            input.value = '';
            renderMessages();

            document.getElementById('loadingIndicator').classList.remove('hidden');

            try {
                var reply = '';
                if (state.engine === 'gemini') {
                    reply = await callGemini(chat.messages);
                } else {
                    reply = await callOpenRouter(chat.messages);
                }
                chat.messages.push({ role: 'ai', content: reply });
            } catch(err) {
                chat.messages.push({ role: 'ai', content: '❌ Error: ' + err.message });
            } finally {
                document.getElementById('loadingIndicator').classList.add('hidden');
                localStorage.setItem('devai_chats', JSON.stringify(state.chats));
                renderMessages();
                renderHistory();
            }
        }

        // Gemini API
        async function callGemini(messages) {
            var url = 'https://generativelanguage.googleapis.com/v1beta/models/' + state.geminiModel + ':generateContent?key=' + state.geminiKey;
            
            var contents = messages.map(function(m) {
                return {
                    role: m.role === 'user' ? 'user' : 'model',
                    parts: [{ text: m.content }]
                };
            });

            var body = {
                contents: contents,
                generationConfig: {
                    temperature: state.temperature,
                    maxOutputTokens: state.maxTokens
                }
            };

            if (state.systemPrompt) {
                body.systemInstruction = { parts: [{ text: state.systemPrompt }] };
            }

            var res = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });

            var data = await res.json();
            if (!res.ok) throw new Error(data.error ? data.error.message : 'Gemini Error');
            return data.candidates[0].content.parts[0].text;
        }

        // OpenRouter API
        async function callOpenRouter(messages) {
            var url = 'https://openrouter.ai/api/v1/chat/completions';
            
            var formatted = [];
            if (state.systemPrompt) {
                formatted.push({ role: 'system', content: state.systemPrompt });
            }
            messages.forEach(function(m) {
                formatted.push({ role: m.role === 'user' ? 'user' : 'assistant', content: m.content });
            });

            var res = await fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + state.openrouterKey
                },
                body: JSON.stringify({
                    model: state.openrouterModel,
                    messages: formatted,
                    temperature: state.temperature,
                    max_tokens: state.maxTokens
                })
            });

            var data = await res.json();
            if (!res.ok) throw new Error(data.error ? data.error.message : 'OpenRouter Error');
            return data.choices[0].message.content;
        }

        // Render Functions
        function renderMessages() {
            var container = document.getElementById('messagesContainer');
            var chat = getCurrentChat();

            if (!chat || chat.messages.length === 0) {
                container.innerHTML = `
                    <div style="text-align: center; margin: auto; max-width: 450px; padding: 20px;">
                        <div style="font-size: 40px; margin-bottom: 10px;">⚡</div>
                        <h2 style="margin-bottom: 8px;">Developer AI Playground</h2>
                        <p style="color: var(--text-muted); font-size: 13px;">
                            Gemini & OpenRouter Ready.
                        </p>
                    </div>
                `;
                return;
            }

            container.innerHTML = '';
            chat.messages.forEach(function(m) {
                var box = document.createElement('div');
                box.className = 'msg-box ' + (m.role === 'user' ? 'user' : 'ai');

                var avatar = document.createElement('div');
                avatar.className = 'msg-avatar ' + (m.role === 'user' ? 'user' : 'ai');
                avatar.innerText = m.role === 'user' ? 'U' : 'AI';

                var content = document.createElement('div');
                content.className = 'msg-content';
                content.innerText = m.content;

                if (m.role === 'user') {
                    box.appendChild(content);
                    box.appendChild(avatar);
                } else {
                    box.appendChild(avatar);
                    box.appendChild(content);
                }

                container.appendChild(box);
            });

            container.scrollTop = container.scrollHeight;
        }

        function renderHistory() {
            var list = document.getElementById('historyList');
            list.innerHTML = '';
            state.chats.forEach(function(c) {
                var div = document.createElement('div');
                div.className = 'history-item';
                div.innerText = c.title;
                div.onclick = function() {
                    state.currentChatId = c.id;
                    renderMessages();
                    toggleDrawer();
                };
                list.appendChild(div);
            });
        }

        function clearAllHistory() {
            if (confirm('Clear all chat history?')) {
                state.chats = [];
                state.currentChatId = null;
                localStorage.removeItem('devai_chats');
                renderHistory();
                renderMessages();
            }
        }
    </script>
</body>
</html>
